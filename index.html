*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}

/* ===== 2. GLASS LOOK — reused by every card ===== */
.glass{position:relative;background:linear-gradient(135deg,var(--glass-hi),var(--glass));
  backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid var(--edge);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 1px var(--edge),inset 0 -1px 1px rgba(255,255,255,.1)}
/* reflective top-left sheen = Apple's layered glass */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:var(--sheen);
  background:linear-gradient(155deg,rgba(255,255,255,.6),transparent 35%,transparent 72%,rgba(110,180,255,.22))}

.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

/* ===== SLIDERS (why / clients / projects / leadership = horizontal with peek, certificates = vertical) ===== */
.sl{--gap:18px;--peek:44px;--cw:calc((100% - var(--peek) - var(--gap)*var(--pv))/var(--pv))}
.sl.single{--cw:calc((100% - var(--gap)*(var(--pv) - 1))/var(--pv))}
.sl.h .slwin{overflow:hidden;padding:8px 0 16px}
.sl.h .sltrack{display:flex;gap:var(--gap);transition:transform .6s cubic-bezier(.22,1,.36,1)}
.sl.h .slitem{flex:0 0 var(--cw)}
.slitem{min-width:0}.slitem>.card,.slitem>.cell{height:100%}

.sl.v{display:flex;gap:14px;align-items:stretch}
.sl.v .slwin{flex:1;min-width:0;overflow:hidden;height:calc(var(--h,300px) + 16px);padding:8px 4px}
.sl.v .sltrack{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);transition:transform .6s cubic-bezier(.22,1,.36,1)}

   <h3>Tools & Technologies</h3>${TOOLCATS.map((c,i)=>`<h4 class="cat muted">${c[0]}</h4>${loop(c[1].map(t=>`<div class="glass tool">${ic(t[1],t[0],t[2]||"")}${t[0]}</div>`),i%2?"rev":"")}`).join("")}
   <h3 style="margin-top:34px;margin-bottom:12px">Leadership & Social Work</h3>
   ${slider("ld",LEAD.map(l=>`<div class="cell glass"><b>${l[0]}</b><br><span class="tag">${l[1]}</span><p class="muted">${l[2]}</p></div>`))}
   <h3 style="margin-top:30px">Awards</h3><div>${AWARDS.map(a=>`<span class="glass pill" style="display:inline-block;margin:6px 6px 0 0">${a}</span>`).join("")}</div>
   <details><summary>Earlier background (Mechanical) & Publication</summary><div class="grid" style="margin-top:12px">${OTHERS_MORE.map(o=>`<div class="glass card"><b>${o[0]}</b><p class="muted">${o[1]}</p></div>`).join("")}</div></details>`},
 {id:"contact",nav:"contact",html:()=>`<h2>${T[lang].contact}</h2><div class="grid">
   <div class="glass card"><b class="hand" style="font-size:1.5rem">For recruiters ✉️</b>
<pre class="code" style="font-size:0.9rem;white-space:pre-wrap"><span class="k">To:</span> ${ME.email}
<span class="k">From:</span> &lt;recruiter email&gt;
<span class="k">Subject:</span> Opportunity for AI Data Engineer
<span class="k">Email:</span>
Hi Tejas, this is &lt;name&gt; from &lt;organisation&gt;.
Your profile matches our requirement and we'd like to move ahead with the hiring process.
<span class="k">With regards,</span> &lt;recruiter name&gt;</pre>

   <a class="btn primary" id="mailBtn" href="#">${ic("i:mail")} Send this draft</a></div>
   <div class="glass card"><b class="hand" style="font-size:1.5rem">Just want to connect? 🤝</b>
   <pre class="code hand" style="font-size:1.0rem;white-space:pre-wrap">Hey Tejas! I'm &lt;name&gt; working on &lt;topic&gt;.
Loved your data engineering work, let's connect!</pre>
   <div style="text-align:center;margin-top:16px"><a class="btn primary" href="${ME.linkedin}" target="_blank">${ic("i:linkedin")} LinkedIn</a></div></div></div>
   <div class="links">${LINKS.map(l=>`<a class="btn" href="${l[1]}" target="_blank" ${l[0]==="Resume"?"download":""}>${l[2]?ic(l[2],l[0],l[3]||""):""} ${l[0]}${l[0]==="Resume"?" "+ic("i:download"):""}</a>`).join("")}</div>`}
];
function render(){
  $("#nav").innerHTML=SECTIONS.map(s=>`<a href="#${s.id}">${T[lang][s.nav]}</a>`).join("");
  $("#app").innerHTML=SECTIONS.map(s=>`<section id="${s.id}">${s.html()}</section>`).join("");
  initSliders();const sw=$("#sw");sw.onclick=()=>sw.classList.toggle("off");
  $("#mailBtn").href=`mailto:${ME.email}?subject=Opportunity for AI Data Engineer&body=Hi Tejas, `;
}
/* Signature replays on click; brand also scrolls home */
$("#brand").onclick=()=>{const s=document.querySelector(".sig");s.classList.remove("go");void s.getBBox();s.classList.add("go")};
$("#theme").onclick=()=>{const d=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=d?"light":"dark";$("#theme").textContent=d?"🌙":"☀️"};
$("#lang").onchange=e=>{lang=e.target.value;document.documentElement.lang=lang;render()};
$("#yr").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
